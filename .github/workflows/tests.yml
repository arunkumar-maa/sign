name: SignBridge AI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Download MediaPipe hand landmarker model asset
      run: |
        python scripts/setup_assets.py

    - name: Run Core and Repaired Test Suites
      run: |
        python -m pytest tests/test_alphabet_and_numbers_suite.py tests/test_final_repair_verification.py tests/test_character_builder.py tests/test_feature_schema.py tests/test_isl_data_collection.py tests/test_live_pipeline_repaired.py tests/test_recognition_repaired.py -v

